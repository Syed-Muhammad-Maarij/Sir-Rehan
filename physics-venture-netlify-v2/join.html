<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Join a class | Physics Venture</title>
    <meta name="description" content="Join an O & A Level Physics class with Sir Rehan Zaidi, or sign in to see your timetable, homework, quizzes, practical scores and results." />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#eef3fa" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <script>
      try {
        var q = /[?&]theme=(night|blueprint)/.exec(location.search);
        if ((q ? q[1] : localStorage.getItem('theme')) === 'night') document.documentElement.dataset.theme = 'night';
      } catch (e) {}
    </script>
    <style>
      html { background: #eef3fa; color: #13294b; }
      html[data-theme='night'] { background: #0b1a33; color: #e7eefb; }
    </style>
    <script type="module" crossorigin src="./assets/join-C6Fs4OMz.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/shared-D548Vmmj.js">
    <link rel="stylesheet" crossorigin href="./assets/join-DHAA1wVr.css">
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <symbol id="mark" viewBox="0 0 64 64">
        <path d="M3 3h46l12 12v46H15L3 49z" fill="#13294b" stroke="#ffffff" stroke-width="2.5" />
        <path d="M18 14h28" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" />
        <path d="M21 14l-3-4M27 14l-3-4M33 14l-3-4M39 14l-3-4M45 14l-3-4" stroke="#9fb6da" stroke-width="1.4" stroke-linecap="round" />
        <path d="M32 14l9 27" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" />
        <path d="M32 14v31" stroke="#9fb6da" stroke-width="1.3" stroke-dasharray="2 3" />
        <path d="M17.5 41.5a30 30 0 0 0 29 0" fill="none" stroke="#9fb6da" stroke-width="1.4" stroke-dasharray="2 3" />
        <circle cx="42" cy="44" r="6" fill="#e0362c" stroke="#ffffff" stroke-width="2" />
      </symbol>
    </svg>
    <div class="bg-fx" aria-hidden="true"></div>

    <!-- ============ JOIN / SIGN IN ============ -->
    <main class="login" id="login" hidden>
      <form class="login-card card" id="loginForm" data-mode="join" novalidate>
        <a href="./" class="brand" aria-label="Back to home">
          <svg class="logo-mk"><use href="#mark" /></svg>
          <span class="brand-name"><span data-cfg="teacher.brand"></span><small data-cfg="teacher.name"></small></span>
        </a>
        <div class="seg l-modes" role="tablist" aria-label="Join or sign in">
          <button type="button" role="tab" data-mode="join">Join a class</button>
          <button type="button" role="tab" data-mode="signin">Sign in</button>
        </div>
        <h1 id="lTitle">Join a class</h1>
        <p id="lSub">Create your account to get your timetable, homework, quizzes and practical scores in one place.</p>
        <label class="fld join-only"><span class="mono">Student's full name</span><input id="lName" name="name" autocomplete="name" /></label>
        <label class="fld"><span class="mono">Username</span><input id="lUser" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required /></label>
        <label class="fld"><span class="mono">Password</span><input id="lPass" name="password" type="password" autocomplete="new-password" required /></label>
        <label class="fld join-only"><span class="mono">Course</span><select id="lCourse" name="course"></select></label>
        <p class="l-err" id="lErr" role="alert"></p>
        <button class="btn btn-primary" type="submit" id="lGo">Join and continue</button>
        <p class="l-demo mono">Demo: any username and password works. Nothing leaves this browser.</p>
        <a class="l-back" href="./">← Back to the website</a>
      </form>
    </main>

    <!-- ============ STUDENT AREA ============ -->
    <div class="app" id="app" hidden>
      <header class="pt-top glass">
        <a href="./" class="brand" aria-label="Back to the website">
          <svg class="logo-mk"><use href="#mark" /></svg>
          <span class="brand-name"><span data-cfg="teacher.brand"></span><small data-cfg="teacher.name"></small></span>
        </a>
        <div class="pt-right">
          <button class="tgl" id="themeBtn" type="button" role="switch" aria-checked="false" aria-label="Night blueprint theme">
            <i class="st s1"></i><i class="st s2"></i><i class="st s3"></i><i class="st s4"></i>
            <span class="tgl-knob">
              <svg class="moon" viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.6A8.2 8.2 0 0 1 9.4 4a8.2 8.2 0 1 0 10.6 10.6z" /></svg>
              <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4" fill="currentColor" /><path d="M12 2.2v2.4M12 19.4v2.4M2.2 12h2.4M19.4 12h2.4M5.1 5.1l1.7 1.7M17.2 17.2l1.7 1.7M5.1 18.9l1.7-1.7M17.2 6.8l1.7-1.7" /></svg>
            </span>
          </button>
          <a class="who" id="who" href="#/profile" aria-label="Your profile"></a>
        </div>
      </header>
      <div class="pt-body">
        <nav class="pt-nav" id="nav" aria-label="Student area"></nav>
        <main class="pt-main" id="view" tabindex="-1"></main>
      </div>
    </div>

    <div class="pt-toast" id="toast" role="status" aria-live="polite"></div>

  </body>
</html>
